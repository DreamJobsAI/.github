# ==============================================================================
# Reusable Deploy Workflow — SSM-based deployment to EC2
# ==============================================================================
#
# Deploys a single service via docker compose pull + up on the target host.
#
# GitHub Environment names: dev | staging | production
# Host stack directories:     /opt/dreamjobs-ai/{dev,staging,prod}
# (production → prod on disk)
#
# USAGE (caller docker-ci.yml) — Deploy is manual, not on every push:
#   deploy:
#     if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
#     uses: DreamJobsAI/.github/.github/workflows/deploy.yml@main
#     with:
#       service_name: "ai-gateway"
#       environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
# ==============================================================================

name: Deploy to EC2

on:
  workflow_call:
    inputs:
      service_name:
        description: "Docker Compose service name (e.g., ai-gateway)"
        required: true
        type: string
      environment:
        description: "GitHub Environment (dev, staging, or production)"
        required: true
        type: string
      aws_account_id:
        description: "AWS account ID for ECR login"
        required: false
        type: string
        default: "371238580923"
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "eu-central-1"
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: "IAM role ARN for OIDC-based SSM access"
        required: true
      EC2_INSTANCE_ID:
        description: "Target EC2 instance ID"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Deploy ${{ inputs.service_name }} → ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Validate environment and resolve stack dir
        id: stack
        run: |
          ENV="${{ inputs.environment }}"
          case "${ENV}" in
            dev|staging)
              STACK_DIR="${ENV}"
              ;;
            production)
              STACK_DIR="prod"
              ;;
            *)
              echo "::error::Invalid environment '${ENV}'. Use 'dev', 'staging', or 'production'."
              exit 1
              ;;
          esac
          echo "stack_dir=${STACK_DIR}" >> "$GITHUB_OUTPUT"
          echo "Resolved GitHub env '${ENV}' → host stack '/opt/dreamjobs-ai/${STACK_DIR}'"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-deploy-${{ inputs.service_name }}-${{ inputs.environment }}-${{ github.run_id }}

      - name: Deploy via SSM
        id: ssm
        run: |
          STACK_DIR="${{ steps.stack.outputs.stack_dir }}"
          SERVICE="${{ inputs.service_name }}"
          ENV_NAME="${{ inputs.environment }}"
          REGION="${{ inputs.aws_region }}"
          ACCOUNT="${{ inputs.aws_account_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          PARAMS=$(jq -nc \
            --arg sd "$STACK_DIR" \
            --arg svc "$SERVICE" \
            --arg env "$ENV_NAME" \
            --arg region "$REGION" \
            --arg account "$ACCOUNT" \
            '{
              commands: [
                "set -e",
                ("echo \"=== Deploying " + $svc + " to " + $env + " (stack=" + $sd + ") ===\""),
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $account + ".dkr.ecr." + $region + ".amazonaws.com"),
                ("cd /opt/dreamjobs-ai/" + $sd),
                ("docker compose pull " + $svc),
                ("docker compose up -d " + $svc),
                "echo \"=== Deploy complete ===\"",
                ("docker ps --filter name=" + $sd + "-" + $svc + " --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"")
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --comment "Deploy ${SERVICE} to ${ENV_NAME} (run ${{ github.run_id }})" \
            --parameters "${PARAMS}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: ${COMMAND_ID}"


      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          echo "Waiting for SSM command ${COMMAND_ID}..."

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${STATUS}" in
              Success)
                echo "Deployment succeeded."

                echo "### Output" >> "$GITHUB_STEP_SUMMARY"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text >> "$GITHUB_STEP_SUMMARY"

                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                echo "::error::Deployment ${STATUS}."

                echo "### Error Output" >> "$GITHUB_STEP_SUMMARY"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text >> "$GITHUB_STEP_SUMMARY"

                exit 1
                ;;
              *)
                echo "Status: ${STATUS} (attempt ${i}/60)"
                sleep 5
                ;;
            esac
          done

          echo "::error::Timed out waiting for SSM command."
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Deployment Details" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Service** | \`${{ inputs.service_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Stack dir** | \`/opt/dreamjobs-ai/${{ steps.stack.outputs.stack_dir }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Instance** | \`${{ secrets.EC2_INSTANCE_ID }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SSM Command** | \`${{ steps.ssm.outputs.command_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | [\`${GITHUB_SHA::8}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
