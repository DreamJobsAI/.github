# ==============================================================================
# Reusable Deploy Workflow — SSM-based deployment to EC2
# ==============================================================================
#
# Deploys a single service via docker compose on the target host.
# Prefer pinning the immutable version tag from docker-build (image_tag input).
#
# GitHub Environment names: dev | staging | production
# Host stack directories:     /opt/dreamjobs-ai/{dev,staging,prod}
#
# On push: callers attempt deploy; if EC2 is stopped and skip_if_instance_stopped
# is true, exits 0 with ::warning:: (visible). Manual deploy fails if stopped.
# ==============================================================================

name: Deploy to EC2

on:
  workflow_call:
    inputs:
      service_name:
        description: "Docker Compose service name (e.g., ai-gateway)"
        required: true
        type: string
      environment:
        description: "GitHub Environment (dev, staging, or production)"
        required: true
        type: string
      image_tag:
        description: "ECR tag to pin (e.g. v12-dev). Empty = stack rolling tag from .env"
        required: false
        type: string
        default: ""
      skip_if_instance_stopped:
        description: "If true, exit 0 with warning when EC2 is not running (push path)"
        required: false
        type: boolean
        default: true
      aws_account_id:
        description: "AWS account ID for ECR login"
        required: false
        type: string
        default: "371238580923"
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "eu-central-1"
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: "IAM role ARN for OIDC-based SSM access"
        required: true
      EC2_INSTANCE_ID:
        description: "Target EC2 instance ID"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Deploy ${{ inputs.service_name }} → ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Validate environment and resolve stack dir
        id: stack
        run: |
          ENV="${{ inputs.environment }}"
          case "${ENV}" in
            dev|staging)
              STACK_DIR="${ENV}"
              ;;
            production)
              STACK_DIR="prod"
              ;;
            *)
              echo "::error::Invalid environment '${ENV}'. Use 'dev', 'staging', or 'production'."
              exit 1
              ;;
          esac
          echo "stack_dir=${STACK_DIR}" >> "$GITHUB_OUTPUT"
          echo "Resolved GitHub env '${ENV}' → host stack '/opt/dreamjobs-ai/${STACK_DIR}'"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-deploy-${{ inputs.service_name }}-${{ inputs.environment }}-${{ github.run_id }}

      - name: Check EC2 instance state
        id: instance
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          STATE=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/tmp/ec2-desc.err || echo "unknown")

          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "Instance ${INSTANCE_ID} state: ${STATE}"

          if [ "${STATE}" = "running" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG="EC2 ${INSTANCE_ID} is '${STATE}' — cannot deploy ${{ inputs.service_name }} to ${{ inputs.environment }}."
          if [ "${{ inputs.skip_if_instance_stopped }}" = "true" ]; then
            echo "::warning title=Deploy skipped (instance not running)::${MSG} Images were still built/pushed to ECR."
            {
              echo "## Deploy skipped"
              echo ""
              echo "${MSG}"
              echo ""
              echo "Images remain in ECR. Start the instance and re-run with \`deploy=true\`, or wait for the next push while the VM is up."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::${MSG}"
          cat /tmp/ec2-desc.err >&2 || true
          exit 1

      - name: Deploy via SSM
        id: ssm
        if: steps.instance.outputs.deployable == 'true'
        run: |
          set -euo pipefail
          STACK_DIR="${{ steps.stack.outputs.stack_dir }}"
          SERVICE="${{ inputs.service_name }}"
          ENV_NAME="${{ inputs.environment }}"
          REGION="${{ inputs.aws_region }}"
          ACCOUNT="${{ inputs.aws_account_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          IMAGE_TAG="${{ inputs.image_tag }}"
          ECR_IMAGE="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/dreamjobs-ai/${SERVICE}"
          TAG_KEY=$(echo "${SERVICE}" | tr 'a-z-' 'A-Z_')
          CONTAINER="${STACK_DIR}-${SERVICE}"

          # Build remote script as a single bash -c payload (reliable quoting).
          if [ -n "${IMAGE_TAG}" ]; then
            REMOTE=$(cat <<EOF
          set -euo pipefail
          echo "=== Deploying ${SERVICE} → ${ENV_NAME} (stack=${STACK_DIR} tag=${IMAGE_TAG}) ==="
          aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com
          cd /opt/dreamjobs-ai/${STACK_DIR}
          printf '%s\n' 'services:' '  ${SERVICE}:' '    image: ${ECR_IMAGE}:${IMAGE_TAG}' > /tmp/dj-image-override.yml
          docker compose -f docker-compose.yml -f /tmp/dj-image-override.yml pull ${SERVICE}
          docker compose -f docker-compose.yml -f /tmp/dj-image-override.yml up -d --no-deps --force-recreate ${SERVICE}
          touch deployed-tags.env
          grep -v '^${TAG_KEY}=' deployed-tags.env > /tmp/dj-tags.env || true
          echo '${TAG_KEY}=${IMAGE_TAG}' >> /tmp/dj-tags.env
          mv /tmp/dj-tags.env deployed-tags.env
          DEADLINE=\$((SECONDS+120))
          while :; do
            H=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ${CONTAINER} 2>/dev/null || echo missing)
            echo "health=\$H"
            [ "\$H" = "healthy" ] || [ "\$H" = "none" ] && break
            [ \$SECONDS -ge \$DEADLINE ] && { docker logs --tail 40 ${CONTAINER} || true; exit 1; }
            sleep 5
          done
          echo "=== Deploy complete ==="
          docker ps --filter name=${CONTAINER} --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "=== Cleaning old images ==="
          docker images --format '{{.Repository}}:{{.Tag}}' | grep "dreamjobs-ai/${SERVICE}:" | grep -v ":${IMAGE_TAG}\$" | xargs -r docker rmi 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          echo "=== Cleanup done ==="
          EOF
          )
          else
            REMOTE=$(cat <<EOF
          set -euo pipefail
          echo "=== Deploying ${SERVICE} → ${ENV_NAME} (stack=${STACK_DIR} rolling tag from .env) ==="
          aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com
          cd /opt/dreamjobs-ai/${STACK_DIR}
          docker compose pull ${SERVICE}
          docker compose up -d --no-deps ${SERVICE}
          DEADLINE=\$((SECONDS+120))
          while :; do
            H=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ${CONTAINER} 2>/dev/null || echo missing)
            echo "health=\$H"
            [ "\$H" = "healthy" ] || [ "\$H" = "none" ] && break
            [ \$SECONDS -ge \$DEADLINE ] && { docker logs --tail 40 ${CONTAINER} || true; exit 1; }
            sleep 5
          done
          echo "=== Deploy complete ==="
          docker ps --filter name=${CONTAINER} --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "=== Cleaning old images ==="
          docker images --format '{{.Repository}}:{{.Tag}}' | grep "dreamjobs-ai/${SERVICE}:" | grep -v ":latest" | xargs -r docker rmi 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          echo "=== Cleanup done ==="
          EOF
          )
          fi

          # One multiline shell script — AWS-RunShellScript executes each array
          # entry with the instance shell; keep it as a single entry.
          PARAMS=$(jq -nc --arg script "$REMOTE" '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 360 \
            --comment "Deploy ${SERVICE} ${IMAGE_TAG:-rolling} to ${ENV_NAME} (run ${{ github.run_id }})" \
            --parameters "${PARAMS}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: ${COMMAND_ID}"

      - name: Wait for deployment
        if: steps.instance.outputs.deployable == 'true'
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          echo "Waiting for SSM command ${COMMAND_ID}..."

          for i in $(seq 1 72); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${STATUS}" in
              Success)
                echo "Deployment succeeded."
                echo "### Output" >> "$GITHUB_STEP_SUMMARY"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                echo "::error::Deployment ${STATUS}."
                echo "### Error Output" >> "$GITHUB_STEP_SUMMARY"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text >> "$GITHUB_STEP_SUMMARY"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              *)
                echo "Status: ${STATUS} (attempt ${i}/72)"
                sleep 5
                ;;
            esac
          done

          echo "::error::Timed out waiting for SSM command."
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          {
            echo ""
            echo "### Deployment Details"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Service** | \`${{ inputs.service_name }}\` |"
            echo "| **Environment** | \`${{ inputs.environment }}\` |"
            echo "| **Image tag** | \`${{ inputs.image_tag || '(rolling from .env)' }}\` |"
            echo "| **Stack dir** | \`/opt/dreamjobs-ai/${{ steps.stack.outputs.stack_dir }}\` |"
            echo "| **Instance** | \`${{ secrets.EC2_INSTANCE_ID }}\` |"
            echo "| **Instance state** | \`${{ steps.instance.outputs.state || 'n/a' }}\` |"
            echo "| **Deployed** | \`${{ steps.instance.outputs.deployable || 'false' }}\` |"
            echo "| **SSM Command** | \`${{ steps.ssm.outputs.command_id || 'n/a' }}\` |"
            echo "| **Commit** | [\`${GITHUB_SHA::8}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| **Triggered by** | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
